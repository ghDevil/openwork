server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Disable buffering globally for streaming endpoints
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Proxy openwork-server API surface to the orchestrator container.
  # Service is named "openwork-host" inside the same compose project, port 8787.
  location ~ ^/(opencode|workspaces|workspace|skills|plugins|mcp|commands|config|audit|runtime|events|sessions|approvals|tokens|capabilities|whoami)(/|$) {
    proxy_pass http://openwork-host:8787;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # /health and /status hit by both SPA and operators
  location = /health  { proxy_pass http://openwork-host:8787; proxy_buffering off; }
  location = /status  { proxy_pass http://openwork-host:8787; proxy_buffering off; }

  # Toy UI (still useful as a debug fallback)
  location /ui {
    proxy_pass http://openwork-host:8787;
    proxy_buffering off;
  }

  # Static assets with long cache
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — anything else returns index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
